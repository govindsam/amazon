    <!-- for product image -->
    <div id="products"></div>
    <script>
        // for sidebar
        function openSidebar() {
            document.getElementById("sidebar").classList.add("open");
        }

        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("open");
        }

        // for product image
        fetch("data.json")
            .then(response => response.json())
            .then(data => {

                const container = document.getElementById("products");
                container.innerHTML = "";


                data.forEach(product => {
                    const item = document.createElement("div");
                    item.className = "product";

                    const img = document.createElement("img");

                    img.src = "../../images/" + product.name + ".jpg";
                    img.alt = product.name;

                    // Remove product if image doesn't exist
                    img.onerror = function () {
                        item.remove();
                    };

                    item.appendChild(img);
                    const ASIN = document.createElement("p");
                    ASIN.textContent = "ASIN : " + product.name;
                    item.appendChild(ASIN);

                    const quantity_for_fba = document.createElement("p");
                    quantity_for_fba.textContent = "quantity_for_fba : " + product.quantity_for_fba;
                    item.appendChild(quantity_for_fba);

                    const fnsku = document.createElement("p");
                    fnsku.textContent = "fnsku : " + product.fnsku;
                    item.appendChild(fnsku);

                    const fnsku_name = document.createElement("p");
                    fnsku_name.textContent = "fnsku_name : " + product.fnsku_name;
                    item.appendChild(fnsku_name);

                   

                    const link = document.createElement("a");
                    link.textContent = "buy";
                    link.href = "https://amazon.com/gp/product/"+product.name;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    item.appendChild(link);

                    container.appendChild(item);
                });

            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });
    </script>
